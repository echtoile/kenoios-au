<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5eaf0">
  <title>Elena's iPhone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="device" aria-label="Fictional iPhone">
    <div class="dynamic-island"></div>
    <div class="status-bar"><span id="status-time">9:41</span><span>●●●  Wi-Fi  ▰</span></div>

    <section id="lock-screen" class="lock-screen">
      <p class="lock-date">MONDAY, NOVEMBER 2</p>
      <h1 id="lock-time">9:41</h1>
      <p class="lock-subtitle">A little world of her own.</p>
      <div class="lock-notification">
        <div class="notification-top"><strong>Messages</strong><span>now</span></div>
        <p><strong>June</strong></p>
        <p>are you still awake?</p>
      </div>
      <button id="unlock-button" class="unlock-button">Tap to open</button>
    </section>

    <section id="home-screen" class="home-screen hidden">
      <div class="welcome">
        <p class="eyebrow">MONDAY, NOVEMBER 2</p>
        <h1>Good morning, Elena.</h1>
        <p class="muted">Here are a few things you missed.</p>
      </div>
      <div class="app-grid">
        <button class="app" data-app="messages"><span class="app-icon messages">✉</span><span>Messages</span></button>
        <button class="app" data-app="instagram"><span class="app-icon instagram">◎</span><span>Instagram</span></button>
        <button class="app" data-app="photos"><span class="app-icon photos">🌈</span><span>Photos</span></button>
        <button class="app" data-app="spotify"><span class="app-icon spotify">≋</span><span>Spotify</span></button>
        <button class="app" data-app="notes"><span class="app-icon notes">▤</span><span>Notes</span></button>
        <button class="app" data-app="gmail"><span class="app-icon gmail">M</span><span>Gmail</span></button>
        <button class="app" data-app="calendar"><span class="app-icon calendar"><small>NOV</small><b>2</b></span><span>Calendar</span></button>
      </div>
      <div class="dock">
        <span class="dock-icon">☎</span><span class="dock-icon">◉</span><span class="dock-icon">✉</span><span class="dock-icon">♫</span>
      </div>
    </section>

    <section id="app-screen" class="app-screen hidden">
      <header class="app-header">
        <button id="back-button" class="back-button" aria-label="Back to home">‹</button>
        <h2 id="app-title">Messages</h2>
        <span class="header-spacer"></span>
      </header>
      <div id="app-content" class="app-content"></div>
    </section>

    <div class="home-indicator"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
